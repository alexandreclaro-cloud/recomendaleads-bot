<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversas — RecomendaLeads</title>
<link rel="stylesheet" href="/theme.css">
<style>
  body { height: 100vh; height: 100dvh; overflow: hidden; }
  .inbox { display: flex; height: 100vh; height: 100dvh; }

  .conv-list { width: 360px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .conv-top { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .conv-top .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--brand); color: #fff; display: grid; place-items: center; }
  .conv-top b { font-size: 1rem; flex: 1; }
  .conv-top a { font-size: 0.8rem; color: var(--text-dim); }
  .conv-search { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .conv-items { flex: 1; overflow-y: auto; }
  .conv-item { display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--border); cursor: pointer; align-items: center; }
  .conv-item:hover { background: var(--surface-2); }
  .conv-item.active { background: var(--brand-soft); }
  .conv-av { width: 42px; height: 42px; border-radius: 50%; background: var(--success); color: #fff; display: grid; place-items: center; font-weight: 600; flex-shrink: 0; }
  .conv-meta { flex: 1; min-width: 0; }
  .conv-meta .nome { font-weight: 600; font-size: 0.9rem; display: flex; justify-content: space-between; gap: 8px; }
  .conv-meta .nome small { color: var(--text-faint); font-weight: 400; font-size: 0.72rem; white-space: nowrap; }
  .conv-meta .prev { font-size: 0.8rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge-naolida { background: var(--success); color: #fff; font-size: 0.68rem; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
  .badge-atendente { background: #DC2626; color: #fff; font-size: 0.62rem; font-weight: 700; border-radius: 999px; padding: 2px 7px; white-space: nowrap; }
  .conv-item.precisa-atendente { background: #FEF2F2; animation: piscaAtend 1.1s ease-in-out infinite; }
  @keyframes piscaAtend { 0%,100% { background: #FEF2F2; } 50% { background: #FEE2E2; } }

  .chat { flex: 1; display: flex; flex-direction: column; background: var(--surface-2); min-width: 0; }
  .chat-empty { flex: 1; display: grid; place-items: center; color: var(--text-dim); font-size: 0.9rem; text-align: center; padding: 20px; }
  .chat-head { padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .chat-head .conv-av { width: 38px; height: 38px; font-size: 0.9rem; }
  .chat-head .info { flex: 1; min-width: 0; }
  .chat-head .info b { font-size: 0.95rem; }
  .chat-head .info small { display: block; color: var(--text-dim); font-size: 0.78rem; }
  .bot-flag { font-size: 0.74rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .bot-flag.on { background: var(--success-soft); color: var(--success-dark); }
  .bot-flag.off { background: var(--action-soft); color: var(--action-dark); }

  .msgs { flex: 1; overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 70%; padding: 9px 13px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; box-shadow: var(--shadow-sm); word-wrap: break-word; white-space: pre-wrap; }
  .bubble small { display: block; font-size: 0.66rem; color: var(--text-faint); margin-top: 3px; text-align: right; }
  .bubble.in { align-self: flex-start; background: var(--surface); }
  .bubble.out { align-self: flex-end; background: var(--brand-soft); }

  .composer { padding: 8px 14px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  .composer input { flex: 1; padding: 8px 12px; font-size: 0.88rem; }
  .composer .btn { padding: 8px 14px; }
  .composer.disabled { opacity: 0.6; }

  @media (max-width: 760px) {
    .conv-list { width: 100%; }
    .conv-list.hide-mobile { display: none; }
    .chat.show-mobile { display: flex; }
    .chat { display: none; }
    /* Botão voltar sempre visível no celular (não depende de JS). */
    #voltarMobile { display: inline-flex !important; }
    /* Cabeçalho do chat: deixa quebrar linha e compacta os botões. */
    .chat-head { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
    .chat-head .info b { font-size: 0.9rem; }
    .chat-head .btn { padding: 7px 10px !important; font-size: 0.76rem !important; }
    .bot-flag { font-size: 0.68rem; }
    /* Bolhas ocupam mais largura no celular. */
    .bubble { max-width: 85%; }
    .msgs { padding: 14px 12px; }
    .composer { padding: 8px 10px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .composer input { font-size: 16px; }  /* evita zoom automático do iOS ao focar */
  }
</style>
</head>
<body>
<div class="inbox">
  <aside class="conv-list" id="convList">
    <div class="conv-top">
      <div class="logo"><i data-lucide="message-circle"></i></div>
      <b>Conversas</b>
      <a href="/minha-empresa/configurar" title="Voltar ao painel"><i data-lucide="arrow-left" style="width:18px;height:18px;vertical-align:-4px"></i></a>
    </div>
    <div class="conv-search">
      <input class="input" type="text" id="buscaConv" placeholder="Buscar contato ou telefone...">
    </div>
    <div class="conv-items" id="convItems"><div class="chat-empty" style="padding:30px">Carregando...</div></div>
  </aside>

  <section class="chat" id="chat">
    <div class="chat-empty" id="chatVazio">Selecione uma conversa à esquerda para ver as mensagens.</div>
    <div id="chatConteudo" style="display:none; flex:1; flex-direction:column; min-height:0;">
      <div class="chat-head">
        <button class="btn btn-ghost" id="voltarMobile" style="display:none;padding:6px"><i data-lucide="arrow-left"></i></button>
        <div class="conv-av" id="chatAv">?</div>
        <div class="info"><b id="chatNome">—</b><small id="chatTel">—</small></div>
        <span class="bot-flag on" id="botFlag">Agente I.A. ativo</span>
        <button class="btn btn-secondary" id="pausarBtn" style="display:none;padding:8px 12px;font-size:0.8rem">🙋 Assumir (sou eu)</button>
        <button class="btn btn-secondary" id="devolverBtn" style="display:none;padding:8px 12px;font-size:0.8rem">Devolver ao Agente I.A.</button>
        <button class="btn btn-ghost" id="resetarBtn" title="Zerar este contato: apaga a conversa e reinicia a pessoa do zero (mantém os leads no CRM)" style="padding:8px 12px;font-size:0.8rem;color:#c0392b">Resetar</button>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="composer" id="composer">
        <input class="input" type="text" id="msgInput" placeholder="Digite uma mensagem... (você assume o atendimento)">
        <button class="btn btn-action" id="enviarBtn"><i data-lucide="send"></i></button>
      </div>
    </div>
  </section>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
const API_BASE = window.location.origin;
const TOKEN = localStorage.getItem('recomendaleads_token');
if (!TOKEN) window.location.href = '/login';
function icons() { try { lucide.createIcons(); } catch (e) {} }

async function fetchAut(url, opts = {}) {
  const resp = await fetch(url, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}), 'Authorization': `Bearer ${TOKEN}` } });
  if (resp.status === 401) { localStorage.removeItem('recomendaleads_token'); window.location.href = '/login'; throw new Error('401'); }
  return resp;
}

let conversas = [];
let atual = null; // telefone selecionado
let botPausadoAtual = false;

function inicial(s) { return ((s || '?').trim()[0] || '?').toUpperCase(); }
function horaCurta(iso) {
  if (!iso) return '';
  const d = new Date(iso), hoje = new Date();
  const mesmaData = d.toDateString() === hoje.toDateString();
  return mesmaData ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
                   : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
}
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

let _atendentesAlertados = new Set();
let _tituloOriginal = document.title;
let _flashTitulo = null;
// Bip curto via Web Audio (sem arquivo externo — passa no CSP).
function tocarBipAtendente() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
    o.start(); o.stop(ctx.currentTime + 0.45);
  } catch (e) {}
}
function atualizarAlertaAtendente() {
  const pendentes = conversas.filter(c => c.precisaAtendente);
  const novos = pendentes.filter(c => !_atendentesAlertados.has(c.telefone));
  if (novos.length) tocarBipAtendente();
  _atendentesAlertados = new Set(pendentes.map(c => c.telefone));
  if (pendentes.length && !_flashTitulo) {
    _flashTitulo = setInterval(() => {
      document.title = document.title.startsWith('🔔') ? _tituloOriginal : `🔔 ${pendentes.length} atendimento(s)!`;
    }, 1000);
  } else if (!pendentes.length && _flashTitulo) {
    clearInterval(_flashTitulo); _flashTitulo = null; document.title = _tituloOriginal;
  }
}
async function carregarConversas() {
  try {
    const resp = await fetchAut(`${API_BASE}/minha-conversas`);
    const data = await resp.json();
    if (!data.ok) return;
    conversas = data.conversas || [];
    renderConversas();
    atualizarAlertaAtendente();
    abrirPelaURL();
  } catch (e) {}
}
// Abre direto a conversa quando o link do aviso traz ?tel=NUMERO (do WhatsApp do atendente).
let _autoAbriu = false;
function abrirPelaURL() {
  if (_autoAbriu) return;
  const telParam = (new URLSearchParams(window.location.search).get('tel') || '').replace(/\D/g, '');
  if (!telParam) return;
  const alvo = conversas.find(c => {
    const d = String(c.telefone || '').replace(/\D/g, '');
    if (!d || d.length < 8) return false;
    const n = Math.min(d.length, telParam.length);
    return n >= 8 && d.slice(-n) === telParam.slice(-n);
  });
  if (alvo) { _autoAbriu = true; abrirConversa(alvo.telefone, alvo.nome || ''); }
}

function renderConversas() {
  const termo = (document.getElementById('buscaConv').value || '').toLowerCase().trim();
  const lista = conversas.filter(c =>
    !termo || (c.nome || '').toLowerCase().includes(termo) || (c.telefone || '').includes(termo));
  const cont = document.getElementById('convItems');
  if (!lista.length) { cont.innerHTML = '<div class="chat-empty" style="padding:30px">Nenhuma conversa ainda.</div>'; return; }
  // Quem pediu atendimento humano vai pro TOPO da lista.
  lista.sort((a, b) => (b.precisaAtendente ? 1 : 0) - (a.precisaAtendente ? 1 : 0));
  cont.innerHTML = lista.map(c => `
    <div class="conv-item ${c.telefone === atual ? 'active' : ''} ${c.precisaAtendente ? 'precisa-atendente' : ''}" data-tel="${esc(c.telefone)}" data-nome="${esc(c.nome || '')}">
      <div class="conv-av">${inicial(c.nome || c.telefone)}</div>
      <div class="conv-meta">
        <div class="nome">${esc(c.nome || c.telefone)} <small>${horaCurta(c.ultimaEm)}</small></div>
        <div class="prev">${c.ultimaDirecao === 'out' ? 'Você: ' : ''}${esc(c.ultimaMensagem || '')}</div>
        ${c.atendenteNome ? `<div class="prev" style="color:var(--action-dark);font-weight:600;font-size:0.72rem;">🙋 Atendendo: ${esc(c.atendenteNome)}</div>` : ''}
      </div>
      ${c.precisaAtendente ? '<span class="badge-atendente">🔔 atende</span>' : (c.naoLidas ? `<span class="badge-naolida">${c.naoLidas}</span>` : '')}
    </div>`).join('');
  cont.querySelectorAll('.conv-item').forEach(el => {
    el.addEventListener('click', () => abrirConversa(el.dataset.tel, el.dataset.nome));
  });
}
document.getElementById('buscaConv').addEventListener('input', renderConversas);

async function abrirConversa(telefone, nome) {
  atual = telefone;
  document.getElementById('chatVazio').style.display = 'none';
  document.getElementById('chatConteudo').style.display = 'flex';
  document.getElementById('chatNome').textContent = nome || telefone;
  document.getElementById('chatTel').textContent = telefone;
  document.getElementById('chatAv').textContent = inicial(nome || telefone);
  document.querySelector('.conv-list').classList.add('hide-mobile');
  document.getElementById('chat').classList.add('show-mobile');
  renderConversas();
  await carregarMensagens(true);
}

async function carregarMensagens(scroll) {
  if (!atual) return;
  try {
    const resp = await fetchAut(`${API_BASE}/minha-conversas/${atual}/mensagens`);
    const data = await resp.json();
    if (!data.ok) return;
    botPausadoAtual = data.botPausado;
    const flag = document.getElementById('botFlag');
    const devolver = document.getElementById('devolverBtn');
    const pausar = document.getElementById('pausarBtn');
    if (botPausadoAtual) {
      flag.textContent = data.atendenteNome ? `🙋 ${data.atendenteNome}` : 'Você assumiu';
      flag.className = 'bot-flag off';
      devolver.style.display = 'inline-flex';
      pausar.style.display = 'none';
    } else {
      flag.textContent = 'Agente I.A. ativo'; flag.className = 'bot-flag on';
      devolver.style.display = 'none';
      pausar.style.display = 'inline-flex';
    }
    const msgs = document.getElementById('msgs');
    const estavaNoFim = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 80;
    msgs.innerHTML = (data.mensagens || []).map(m => `
      <div class="bubble ${m.direcao === 'out' ? 'out' : 'in'}">${esc(m.texto)}<small>${horaCurta(m.criadoEm)}</small></div>
    `).join('') || '<div class="chat-empty">Nenhuma mensagem ainda.</div>';
    if (scroll || estavaNoFim) msgs.scrollTop = msgs.scrollHeight;
  } catch (e) {}
}

async function enviar() {
  const input = document.getElementById('msgInput');
  const texto = input.value.trim();
  if (!texto || !atual) return;
  input.value = '';
  try {
    await fetchAut(`${API_BASE}/minha-conversas/${atual}/enviar`, { method: 'POST', body: JSON.stringify({ mensagem: texto }) });
    await carregarMensagens(true);
    await carregarConversas();
  } catch (e) { input.value = texto; }
}
document.getElementById('enviarBtn').addEventListener('click', enviar);
document.getElementById('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });

document.getElementById('devolverBtn').addEventListener('click', async () => {
  if (!atual) return;
  try { await fetchAut(`${API_BASE}/minha-conversas/${atual}/devolver`, { method: 'POST' }); await carregarMensagens(); } catch (e) {}
});

// Pausa o Agente I.A. neste contato SEM enviar mensagem (você assume o atendimento).
document.getElementById('pausarBtn').addEventListener('click', async () => {
  if (!atual) return;
  try { await fetchAut(`${API_BASE}/minha-conversas/${atual}/pausar`, { method: 'POST' }); await carregarMensagens(); } catch (e) {}
});

// Reseta o contato: apaga a conversa e reinicia a pessoa do zero (mantém leads).
document.getElementById('resetarBtn').addEventListener('click', async () => {
  if (!atual) return;
  if (!confirm('Resetar este contato?\n\nApaga a conversa e reinicia a pessoa do zero (como se nunca tivesse falado com o bot). Os leads no CRM são mantidos.\n\nEsta ação não pode ser desfeita.')) return;
  try {
    await fetchAut(`${API_BASE}/minha-conversas/${atual}/resetar`, { method: 'POST' });
    // A conversa é apagada — volta ao estado vazio e recarrega a lista.
    atual = null;
    document.getElementById('chatConteudo').style.display = 'none';
    document.getElementById('chatVazio').style.display = '';
    await carregarConversas();
  } catch (e) {}
});

document.getElementById('voltarMobile').addEventListener('click', () => {
  document.querySelector('.conv-list').classList.remove('hide-mobile');
  document.getElementById('chat').classList.remove('show-mobile');
});
if (window.innerWidth <= 760) document.getElementById('voltarMobile').style.display = 'inline-flex';

icons();
carregarConversas();
setInterval(carregarConversas, 6000);
setInterval(() => { if (atual) carregarMensagens(false); }, 4000);
</script>
</body>
</html>
