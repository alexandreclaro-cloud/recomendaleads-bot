<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — RecomendaLeads</title>
<style>
  :root {
    --bg: #f4f7f6;
    --card: #ffffff;
    --line: #e7ecf0;
    --text: #14202b;
    --text-dim: #6b7a8a;
    --accent: #ef7d1a;
    --accent-dark: #cb6411;
    --accent-soft: #fdeede;
    --success: #16a34a;
    --error: #e25555;
    --shadow: 0 1px 2px rgba(16,32,48,0.04), 0 10px 30px rgba(16,32,48,0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 38px 34px;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--shadow);
  }
  .logo {
    width: 52px; height: 52px; margin: 0 auto 14px;
    border-radius: 14px; background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-size: 26px;
  }
  h1 { text-align: center; font-size: 1.25rem; margin: 0 0 6px; letter-spacing: -0.3px; }
  p.sub { text-align: center; font-size: 0.85rem; color: var(--text-dim); margin: 0 0 26px; }
  label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
  input[type="email"], input[type="password"] {
    width: 100%;
    background: #fbfcfd;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 13px;
    color: var(--text);
    font-size: 0.95rem;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--accent); background: #fff; }
  button {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 4px;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.55; cursor: default; }
  .msg { font-size: 0.85rem; text-align: center; margin-top: 14px; min-height: 18px; font-weight: 600; }
  .msg.err { color: var(--error); }
  .msg.ok { color: var(--success); }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">🎁</div>
    <h1>RecomendaLeads</h1>
    <p class="sub">Acesse o painel da sua empresa.</p>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="emailInput" required autocomplete="username">
      <label>Senha</label>
      <input type="password" id="senhaInput" required autocomplete="current-password">
      <button type="submit" id="loginBtn">Entrar</button>
      <div class="msg" id="msgBox"></div>
    </form>
  </div>
<script>
const API_BASE = window.location.origin;
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const msgBox = document.getElementById('msgBox');
  const email = document.getElementById('emailInput').value.trim();
  const senha = document.getElementById('senhaInput').value;
  btn.disabled = true;
  msgBox.textContent = '';
  msgBox.className = 'msg';
  try {
    const resp = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });
    const data = await resp.json();
    if (resp.ok && data.ok) {
      localStorage.setItem('recomendaleads_token', data.token);
      localStorage.setItem('recomendaleads_empresa', JSON.stringify(data.empresa));
      msgBox.textContent = `✅ Login funcionou! Redirecionando...`;
      msgBox.className = 'msg ok';
      setTimeout(() => { window.location.href = '/minha-empresa/configurar'; }, 800);
    } else {
      msgBox.textContent = data.erro || 'Email ou senha incorretos';
      msgBox.className = 'msg err';
    }
  } catch (err) {
    msgBox.textContent = 'Erro de conexão. Tente novamente.';
    msgBox.className = 'msg err';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
