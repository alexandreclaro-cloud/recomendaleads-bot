<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — RecomendaLeads</title>
<link rel="stylesheet" href="/theme.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .box { width: 100%; max-width: 392px; padding: 40px 36px; }
  .logo { width: 54px; height: 54px; margin: 0 auto 18px; border-radius: 15px; background: var(--brand); color: #fff; display: grid; place-items: center; }
  .logo .ti { width: 28px; height: 28px; }
  h1 { text-align: center; font-size: 1.3rem; margin-bottom: 6px; }
  .sub { text-align: center; font-size: 0.88rem; color: var(--text-dim); margin: 0 0 28px; }
  .box .btn { width: 100%; margin-top: 6px; }
  .msg { font-size: 0.85rem; text-align: center; margin-top: 16px; min-height: 18px; font-weight: 600; }
  .msg.err { color: var(--danger-dark); }
  .msg.ok { color: var(--success-dark); }
</style>
</head>
<body>
  <div class="box card fade-in">
    <div class="logo"><i data-lucide="gift"></i></div>
    <h1>RecomendaLeads</h1>
    <p class="sub" id="subText">Acesse o painel da sua empresa.</p>
    <form id="loginForm">
      <label class="label">Email</label>
      <input class="input" type="email" id="emailInput" required autocomplete="username">
      <label class="label">Senha</label>
      <input class="input" type="password" id="senhaInput" required autocomplete="current-password">
      <button type="submit" class="btn btn-action" id="loginBtn">Entrar</button>
      <div class="msg" id="msgBox"></div>
    </form>

    <form id="novaSenhaForm" style="display:none">
      <label class="label">Nova senha</label>
      <input class="input" type="password" id="novaSenhaInput" minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      <label class="label">Confirme a nova senha</label>
      <input class="input" type="password" id="confirmaSenhaInput" minlength="6" autocomplete="new-password">
      <button type="submit" class="btn btn-action" id="salvarSenhaBtn">Salvar e entrar</button>
      <div class="msg" id="msgSenhaBox"></div>
    </form>
    <p style="text-align:center; margin-top:18px; font-size:.78rem; color:var(--text-dim,#6b7280);">
      Ao entrar, você concorda com o <a href="/contrato" target="_blank" style="color:var(--brand,#b8860b);">Contrato de Assinatura e Política de Privacidade</a>.
    </p>
  </div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
lucide.createIcons();
const API_BASE = window.location.origin;
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const msgBox = document.getElementById('msgBox');
  const email = document.getElementById('emailInput').value.trim();
  const senha = document.getElementById('senhaInput').value;
  btn.disabled = true;
  msgBox.textContent = '';
  msgBox.className = 'msg';
  try {
    const resp = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });
    const data = await resp.json();
    if (resp.ok && data.ok) {
      localStorage.setItem('recomendaleads_token', data.token);
      localStorage.setItem('recomendaleads_empresa', JSON.stringify(data.empresa));
      if (data.empresa.senhaProvisoria) {
        // Primeiro acesso: obriga a definir uma senha própria antes de entrar.
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('novaSenhaForm').style.display = 'block';
        document.getElementById('subText').textContent = 'Primeiro acesso: defina sua nova senha.';
        document.getElementById('novaSenhaInput').focus();
      } else {
        msgBox.textContent = '✅ Login funcionou! Redirecionando...';
        msgBox.className = 'msg ok';
        setTimeout(() => { window.location.href = '/minha-empresa/configurar'; }, 800);
      }
    } else {
      msgBox.textContent = data.erro || 'Email ou senha incorretos';
      msgBox.className = 'msg err';
    }
  } catch (err) {
    msgBox.textContent = 'Erro de conexão. Tente novamente.';
    msgBox.className = 'msg err';
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('novaSenhaForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('salvarSenhaBtn');
  const msgBox = document.getElementById('msgSenhaBox');
  const nova = document.getElementById('novaSenhaInput').value;
  const confirma = document.getElementById('confirmaSenhaInput').value;
  msgBox.textContent = '';
  msgBox.className = 'msg';
  if (nova.length < 6) {
    msgBox.textContent = 'A senha precisa ter ao menos 6 caracteres.';
    msgBox.className = 'msg err';
    return;
  }
  if (nova !== confirma) {
    msgBox.textContent = 'As senhas não coincidem.';
    msgBox.className = 'msg err';
    return;
  }
  btn.disabled = true;
  try {
    const token = localStorage.getItem('recomendaleads_token');
    const resp = await fetch(`${API_BASE}/minha-senha`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ novaSenha: nova })
    });
    const data = await resp.json();
    if (resp.ok && data.ok) {
      const empresa = JSON.parse(localStorage.getItem('recomendaleads_empresa') || '{}');
      empresa.senhaProvisoria = false;
      localStorage.setItem('recomendaleads_empresa', JSON.stringify(empresa));
      msgBox.textContent = '✅ Senha definida! Redirecionando...';
      msgBox.className = 'msg ok';
      setTimeout(() => { window.location.href = '/minha-empresa/configurar'; }, 800);
    } else {
      msgBox.textContent = data.erro || 'Erro ao salvar a senha';
      msgBox.className = 'msg err';
    }
  } catch (err) {
    msgBox.textContent = 'Erro de conexão. Tente novamente.';
    msgBox.className = 'msg err';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
