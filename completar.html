<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete seu cadastro — RecomendaLeads</title>
<link rel="icon" type="image/png" href="/assets/logo-symbol.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root {
    --brand:#D4AF37; --brand-deep:#B8912A; --brand-bright:#ECCB72;
    --brand-soft:rgba(212,175,55,.12); --brand-soft2:rgba(212,175,55,.2);
    --bg:#09090B; --surface:#17171C; --surface-2:#1D1D23;
    --text:#F3F1EA; --text-dim:#AFA99D; --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
  }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, system-ui, sans-serif; margin: 0; min-height: 100vh; -webkit-font-smoothing:antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 44px 20px 80px; }
  .lockup { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 auto 22px; }
  .lsym-chip { height: 48px; width: 48px; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .lsym { height: 33px; width: auto; display: block; }
  .lw { height: 34px; width: auto; display: block; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 26px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; font-weight: 800; letter-spacing: -.02em; }
  .sub { color: var(--text-dim); margin: 0 0 22px; font-size: 0.95rem; }
  .sec { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--brand-bright); margin: 22px 0 6px; padding-top: 16px; border-top: 1px solid var(--line); }
  .sec:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media(max-width:480px){ .row2 { grid-template-columns: 1fr; } }
  label { display: block; font-size: 0.84rem; color: var(--text-dim); margin: 14px 0 5px; font-weight: 500; }
  .inp, select.inp { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); color: var(--text); font-size: 0.95rem; font-family: inherit; }
  .inp:focus, select.inp:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .inp[readonly] { opacity: .7; }
  .hint { font-size: 0.74rem; color: var(--text-dim); margin-top: 4px; opacity: 0.85; }
  .aceite { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0; font-size: 0.88rem; }
  .aceite a { color: var(--brand-bright); }
  .btn { width: 100%; margin-top: 8px; padding: 13px; border: none; border-radius: 999px; background: var(--brand); color: #171206; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background .12s,transform .12s; }
  .btn:hover { background: var(--brand-bright); transform: translateY(-1px); }
  .btn:disabled { opacity: .6; cursor: default; transform: none; }
  .msg { margin-top: 12px; font-size: 0.88rem; text-align: center; }
  .msg.err { color: #e57373; }
  .center { text-align: center; padding: 40px 0; color: var(--text-dim); }
  .ok-emoji { font-size: 2.4rem; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="lockup"><span class="lsym-chip"><img class="lsym" src="/assets/logo-symbol.png" alt=""></span><img class="lw" src="/assets/logo-wordmark.png" alt="RecomendaLeads"></div>
    <div class="card" id="card">
      <div class="center" id="loading">
        <div class="ok-emoji">⏳</div>
        <p>Confirmando seu pagamento...</p>
      </div>

      <div id="form" style="display:none;">
        <h1>🎉 Pagamento confirmado!</h1>
        <p class="sub">Falta pouco. Complete os dados da sua empresa e crie seu acesso.</p>

        <div class="sec">Dados da empresa</div>
        <label>E-mail (seu login)</label>
        <input class="inp" id="email" readonly>
        <label>Nome do seu negócio *</label>
        <input class="inp" id="nomeFantasia" placeholder="Ex: Barbearia do João">
        <label>Razão social</label>
        <input class="inp" id="razaoSocial" placeholder="Razão social (opcional)">
        <label>CNPJ</label>
        <input class="inp" id="cnpj" placeholder="00.000.000/0000-00">

        <label>CEP</label>
        <input class="inp" id="cep" inputmode="numeric" placeholder="00000-000">
        <div class="hint" id="cepHint">Digite o CEP que o endereço é preenchido sozinho.</div>
        <label>Endereço (rua e número)</label>
        <input class="inp" id="endereco" placeholder="Rua Exemplo, 123 — sala 4">
        <div class="row2">
          <div>
            <label>Bairro</label>
            <input class="inp" id="bairro" placeholder="Centro">
          </div>
          <div>
            <label>Cidade</label>
            <input class="inp" id="cidade" placeholder="São Paulo">
          </div>
        </div>
        <label>Estado</label>
        <select class="inp" id="estado">
          <option value="">Selecione…</option>
          <option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option>
          <option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option>
          <option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option>
          <option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
          <option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option>
          <option>SE</option><option>TO</option>
        </select>
        <label>WhatsApp / telefone</label>
        <input class="inp" id="telefone" placeholder="(11) 99999-9999">

        <div class="sec">Responsável e acesso</div>
        <label>Seu nome (responsável)</label>
        <input class="inp" id="nomeSocio" placeholder="Nome de quem administra">
        <label>Crie uma senha de acesso *</label>
        <input class="inp" type="password" id="senha" placeholder="Mínimo 6 caracteres">
        <label>Confirme a senha *</label>
        <input class="inp" type="password" id="senha2" placeholder="Repita a senha">

        <div class="aceite">
          <input type="checkbox" id="aceite" style="margin-top:3px;">
          <label for="aceite" style="margin:0;color:var(--text);font-weight:400;">Li e aceito o <a href="/contrato" target="_blank">Contrato de Assinatura, os Termos de Uso e a Política de Privacidade</a>.</label>
        </div>

        <button class="btn" id="finalizarBtn">Finalizar e acessar a plataforma</button>
        <div class="msg" id="msg"></div>
      </div>

      <div class="center" id="erro" style="display:none;">
        <div class="ok-emoji">😕</div>
        <p id="erroTxt">Não foi possível confirmar o pagamento.</p>
      </div>
    </div>
  </div>

<script>
const API_BASE = window.location.origin;
const refPagamento = new URLSearchParams(location.search).get('ref');

async function verificar(tentativa) {
  if (!refPagamento) { mostrarErro('Link inválido. Referência de pagamento ausente.'); return; }
  try {
    const resp = await fetch(`${API_BASE}/completar/status?ref=${encodeURIComponent(refPagamento)}`);
    const data = await resp.json();
    if (data.ok && data.pronto) {
      if (data.jaCompleto) {
        mostrarErro(data.aguardandoAdesao
          ? 'Pagamento do cartão confirmado! Seu acesso é liberado assim que o Pix da adesão for pago.'
          : 'Pagamento confirmado e cadastro concluído! Faça login para entrar.');
        document.querySelector('#erro .ok-emoji').textContent = '✅';
        return;
      }
      document.getElementById('email').value = data.email || '';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('form').style.display = 'block';
      return;
    }
    // Pagamento ainda processando — tenta de novo algumas vezes.
    if ((tentativa || 0) < 12) setTimeout(() => verificar((tentativa || 0) + 1), 2500);
    else mostrarErro('Pagamento ainda não confirmado. Se você pagou, aguarde alguns minutos e recarregue a página.');
  } catch (e) {
    if ((tentativa || 0) < 12) setTimeout(() => verificar((tentativa || 0) + 1), 2500);
    else mostrarErro('Erro de conexão. Recarregue a página.');
  }
}

function mostrarErro(txt) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('form').style.display = 'none';
  document.getElementById('erro').style.display = 'block';
  document.getElementById('erroTxt').textContent = txt;
}

// ── Máscaras: CNPJ 00.000.000/0000-00 · Tel (11) 90000-0000 · CEP 00000-000 ──
function maskCNPJ(el) {
  const d = el.value.replace(/\D/g, '').slice(0, 14);
  let v = d;
  if (d.length > 2) v = d.slice(0, 2) + '.' + d.slice(2);
  if (d.length > 5) v = d.slice(0, 2) + '.' + d.slice(2, 5) + '.' + d.slice(5);
  if (d.length > 8) v = d.slice(0, 2) + '.' + d.slice(2, 5) + '.' + d.slice(5, 8) + '/' + d.slice(8);
  if (d.length > 12) v = d.slice(0, 2) + '.' + d.slice(2, 5) + '.' + d.slice(5, 8) + '/' + d.slice(8, 12) + '-' + d.slice(12);
  el.value = v;
}
function maskTel(el) {
  const d = el.value.replace(/\D/g, '').slice(0, 11);
  if (d.length <= 2) el.value = d;
  else if (d.length <= 6) el.value = '(' + d.slice(0, 2) + ') ' + d.slice(2);
  else if (d.length <= 10) el.value = '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  else el.value = '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
}
function maskCEP(el) {
  const d = el.value.replace(/\D/g, '').slice(0, 8);
  el.value = d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d;
}
// Busca o endereço pelo CEP (ViaCEP) e preenche bairro/cidade/estado.
async function buscarCep() {
  const el = document.getElementById('cep');
  const hint = document.getElementById('cepHint');
  const cep = (el.value || '').replace(/\D/g, '');
  if (cep.length !== 8) return;
  hint.textContent = 'Buscando endereço...';
  try {
    const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const d = await r.json();
    if (d.erro) { hint.textContent = 'CEP não encontrado — preencha o endereço à mão.'; return; }
    const set = (id, v) => { const e = document.getElementById(id); if (e && v) e.value = v; };
    set('bairro', d.bairro);
    set('cidade', d.localidade);
    const uf = document.getElementById('estado');
    if (uf && d.uf) uf.value = d.uf;
    const rua = document.getElementById('endereco');
    if (rua && d.logradouro && !rua.value) { rua.value = d.logradouro + ', '; rua.focus(); }
    hint.textContent = 'Endereço encontrado ✓ Confira e complete o número.';
  } catch (e) {
    hint.textContent = 'Não consegui buscar o CEP — preencha o endereço à mão.';
  }
}
(function ligarMascaras() {
  const cep = document.getElementById('cep');
  cep.addEventListener('input', () => { maskCEP(cep); if (cep.value.replace(/\D/g, '').length === 8) buscarCep(); });
  cep.addEventListener('blur', buscarCep);
  document.getElementById('cnpj').addEventListener('input', function(){ maskCNPJ(this); });
  document.getElementById('telefone').addEventListener('input', function(){ maskTel(this); });
})();

document.getElementById('finalizarBtn').addEventListener('click', async () => {
  const btn = document.getElementById('finalizarBtn');
  const msg = document.getElementById('msg');
  const nomeFantasia = document.getElementById('nomeFantasia').value.trim();
  const senha = document.getElementById('senha').value;
  const senha2 = document.getElementById('senha2').value;
  const aceite = document.getElementById('aceite').checked;
  msg.textContent = ''; msg.className = 'msg';
  if (!nomeFantasia) { msg.textContent = 'Informe o nome do seu negócio.'; msg.className = 'msg err'; return; }
  if (senha.length < 6) { msg.textContent = 'A senha precisa ter ao menos 6 caracteres.'; msg.className = 'msg err'; return; }
  if (senha !== senha2) { msg.textContent = 'As senhas não coincidem.'; msg.className = 'msg err'; return; }
  if (!aceite) { msg.textContent = 'É necessário aceitar o contrato.'; msg.className = 'msg err'; return; }

  const dados = {
    nomeFantasia,
    razaoSocial: document.getElementById('razaoSocial').value.trim(),
    cnpj: document.getElementById('cnpj').value.trim(),
    cep: document.getElementById('cep').value.trim(),
    enderecoEmpresa: document.getElementById('endereco').value.trim(),
    bairro: document.getElementById('bairro').value.trim(),
    cidade: document.getElementById('cidade').value.trim(),
    estado: document.getElementById('estado').value,
    telefone: document.getElementById('telefone').value.trim(),
    nomeSocio: document.getElementById('nomeSocio').value.trim()
  };
  btn.disabled = true; msg.textContent = 'Finalizando...';
  try {
    const resp = await fetch(`${API_BASE}/completar`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: refPagamento, dados, senha, aceiteContrato: true })
    });
    const data = await resp.json();
    if (resp.ok && data.ok) {
      localStorage.setItem('recomendaleads_token', data.token);
      localStorage.setItem('recomendaleads_empresa', JSON.stringify(data.empresa));
      msg.className = 'msg'; msg.textContent = '✅ Tudo pronto! Entrando...';
      setTimeout(() => { window.location.href = '/minha-empresa/configurar'; }, 800);
    } else {
      msg.textContent = '❌ ' + (data.erro || 'Erro ao finalizar'); msg.className = 'msg err'; btn.disabled = false;
    }
  } catch (e) { msg.textContent = '❌ Erro de conexão'; msg.className = 'msg err'; btn.disabled = false; }
});

verificar(0);
</script>
</body>
</html>
