<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Cadastrar Empresa</title>
<style>
  :root {
    --navy: #0a1628;
    --navy-light: #132338;
    --gold: #d4af37;
    --gold-light: #f0d878;
    --text: #e8edf4;
    --text-dim: #9aabc0;
    --success: #3ddc97;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, var(--navy) 0%, #060d18 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 16px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { color: var(--gold-light); font-size: 1.4rem; text-align: center; margin-bottom: 6px; }
  p.sub { color: var(--text-dim); text-align: center; margin-bottom: 28px; font-size: 0.9rem; }

  .card {
    background: var(--navy-light);
    border: 1px solid rgba(212,175,55,0.18);
    border-radius: 14px;
    padding: 24px;
  }
  label { display: block; font-size: 0.82rem; color: var(--text-dim); margin: 14px 0 5px; }
  label:first-child { margin-top: 0; }
  input[type="password"], input[type="text"], input[type="email"] {
    width: 100%;
    background: #0e1a2c;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 0.92rem;
  }
  input:focus { outline: none; border-color: var(--gold); }
  .hint { font-size: 0.74rem; color: var(--text-dim); margin-top: 4px; opacity: 0.8; }

  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 18px;
    padding: 12px;
    background: rgba(212,175,55,0.06);
    border: 1px solid rgba(212,175,55,0.2);
    border-radius: 8px;
  }
  .checkbox-row input[type="checkbox"] {
    margin-top: 2px;
    width: 16px;
    height: 16px;
    accent-color: var(--gold);
    cursor: pointer;
  }
  .checkbox-row label {
    margin: 0;
    font-size: 0.85rem;
    color: var(--text);
    cursor: pointer;
  }
  .checkbox-row .hint { margin-top: 4px; }

  button {
    width: 100%;
    background: var(--gold);
    color: var(--navy);
    border: none;
    font-weight: 700;
    font-size: 0.92rem;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 20px;
  }
  button:hover { opacity: 0.92; }
  button:disabled { opacity: 0.5; cursor: default; }

  .status { font-size: 0.85rem; margin-top: 14px; text-align: center; font-weight: 600; }
  .status.ok { color: var(--success); }
  .status.err { color: var(--error); }

  .resultado {
    background: rgba(61,220,151,0.08);
    border: 1px solid rgba(61,220,151,0.3);
    border-radius: 10px;
    padding: 16px;
    margin-top: 16px;
    font-size: 0.88rem;
    display: none;
  }
  .resultado.show { display: block; }
  .resultado b { color: var(--success); }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚙️ Cadastrar Empresa</h1>
  <p class="sub">Painel administrativo de cadastro de empresas com login.</p>

  <div class="card">
    <label>Chave administrativa</label>
    <input type="password" id="adminKeyInput" placeholder="Chave de acesso administrativo">
    <div class="hint">Configurada na variável de ambiente ADMIN_SECRET do Render.</div>

    <label>Nome da empresa</label>
    <input type="text" id="nomeInput" placeholder="Ex: Empresa de Teste">

    <label>Email de login</label>
    <input type="email" id="emailInput" placeholder="teste@empresa.com">

    <label>Senha de login</label>
    <input type="text" id="senhaInput" placeholder="Defina uma senha para testar">

    <div class="checkbox-row">
      <input type="checkbox" id="migrarConfigCheckbox">
      <div>
        <label for="migrarConfigCheckbox">Migrar configuração da empresa principal</label>
